# ============================================================
# Docker-specific overrides
# ============================================================
# This file is ONLY loaded when spring.profiles.active=docker.
# Values here override application.properties.

# In Docker, "db" resolves to the database container's IP
# (Docker's internal DNS handles this automatically).
spring.datasource.url=jdbc:postgresql://db:5432/job_portal
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# In production, override this with an environment variable!
# The ${VAR:default} syntax means: use env var if set, else use default.
jwt.secret=${JWT_SECRET:mySecretKeyForJobMatchApplicationThatIsVeryLongAndSecureEnoughForHS512Algorithm}

# Store uploads inside the container volume
file.upload-dir=/app/uploads/resumes

# Less verbose logging in Docker
logging.level.com.ali.jobmatch=INFO
spring.jpa.show-sql=false
