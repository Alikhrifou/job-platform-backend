# ============================================================
# Docker / Production overrides
# ============================================================
# This file is ONLY loaded when spring.profiles.active=docker.
# All sensitive values MUST be set via environment variables.
# The application will fail to start if required variables are missing.

spring.datasource.url=jdbc:postgresql://db:5432/job_portal
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JWT secret — REQUIRED, no fallback in production
jwt.secret=${JWT_SECRET}

# Disable automatic SQL init in production (schema managed by Hibernate)
spring.sql.init.mode=never

# Store uploads inside the container volume
file.upload-dir=/app/uploads/resumes

# Logging
logging.level.root=WARN
logging.level.com.ali.jobmatch=INFO
spring.jpa.show-sql=false

# Disable Swagger UI in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Production connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# CORS: set allowed origins via env var
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
