spring.application.name=job-match

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/job_portal
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Run data.sql after Hibernate DDL completes
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=mySecretKeyForJobMatchApplicationThatIsVeryLongAndSecureEnoughForHS512Algorithm
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Logging Configuration
logging.level.root=INFO
logging.level.com.ali.jobmatch=DEBUG

# File Upload Configuration
file.upload-dir=uploads/resumes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
