spring.application.name=job-match

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/job_portal
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=mySecretKeyForJobMatchApplicationThatIsVeryLongAndSecureEnoughForHS512Algorithm
jwt.expiration=86400000

# Logging Configuration
logging.level.root=INFO
logging.level.com.ali.jobmatch=DEBUG

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
