# ============================================================
# Backend CI/CD Pipeline (Standalone Repo)
# ============================================================
# This runs every time you push to the job-platform-backend repo.
# No "paths:" filter needed — the whole repo IS the backend.
#
# FLOW:
# Push/PR to main → Build Java → Run tests → Build Docker image
#                 → Push to Docker Hub
# ============================================================

name: Backend CI/CD

# WHEN: every push or PR to main (no paths filter needed)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------
  # JOB 1: Build and Test
  # ----------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: job_portal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # Cache uses pom.xml at root (no subfolder prefix)
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # No working-directory needed — we're already at the repo root
      - name: Build and test with Maven
        run: mvn verify -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/job_portal
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

  # ----------------------------------------------------------
  # JOB 2: Build and Push Docker Image
  # ----------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # context is "." (root) since the Dockerfile is at the repo root
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            akhrifou/jobmatch-backend:latest
            akhrifou/jobmatch-backend:${{ github.sha }}
